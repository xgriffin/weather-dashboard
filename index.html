<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./develop/css/styles.css">
  <title>Weather Dashboard</title>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Weather</h1>
      </div>

      <form id="search-box" role="search">
        <label for="input-box" class="visually-hidden">Search for a city</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="input-box" type="text" placeholder="Search for a city" autocomplete="off">
        <button id="s-button" type="submit">Search</button>
      </form>
    </header>

    <div id="search-history" aria-label="Recent searches"></div>

    <main id="weather-section">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true"></div>
        <h2>Check the weather anywhere</h2>
        <p>Search for a city to see current conditions and the next five days.</p>
      </div>
    </main>

    <footer class="footer">Data from OpenWeather and Open-Meteo</footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.slim.js"
    integrity="sha256-HwWONEZrpuoh951cQD1ov2HUK5zA5DwJ1DNUXaM6FsY=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
  <script src="./develop/js/script.js"></script>
</body>

</html>
